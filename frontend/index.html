<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050810" />
    <title>Zorai</title>
    <style>
      /* ── Zorai boot splash ───────────────────────────────────────────────
         Shown before the React bundle loads; faded out by main.tsx once
         hydration completes. Pure CSS so it renders instantly. */
      html, body { margin: 0; padding: 0; height: 100%; background: #05070b; }

      #zorai-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        background:
          radial-gradient(1200px 600px at 50% -10%, rgba(119, 216, 197, 0.09), transparent 60%),
          radial-gradient(900px 500px at 50% 110%, rgba(88, 130, 247, 0.08), transparent 60%),
          linear-gradient(180deg, #06080d 0%, #04060a 100%);
        color: #d9e2ef;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        user-select: none;
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      #zorai-boot.zorai-boot--done {
        opacity: 0;
        pointer-events: none;
      }

      /* Ambient animated orbs behind the logo */
      #zorai-boot .zorai-boot-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.5;
        animation: zorai-boot-drift 9s ease-in-out infinite alternate;
      }
      #zorai-boot .zorai-boot-orb--a {
        width: 340px; height: 340px;
        background: rgba(119, 216, 197, 0.16);
        top: 18%; left: 30%;
      }
      #zorai-boot .zorai-boot-orb--b {
        width: 300px; height: 300px;
        background: rgba(88, 130, 247, 0.14);
        bottom: 16%; right: 28%;
        animation-delay: -4.5s;
      }
      @keyframes zorai-boot-drift {
        from { transform: translate3d(-24px, -18px, 0) scale(1); }
        to   { transform: translate3d(24px, 18px, 0) scale(1.08); }
      }

      /* Logo with breathing glow + pulsing ring */
      #zorai-boot .zorai-boot-logo-wrap {
        position: relative;
        width: 128px;
        height: 128px;
        display: grid;
        place-items: center;
        margin-bottom: 26px;
      }
      #zorai-boot .zorai-boot-logo {
        width: 104px;
        height: 104px;
        border-radius: 24px;
        animation: zorai-boot-breathe 2.8s ease-in-out infinite;
        filter: drop-shadow(0 0 26px rgba(119, 216, 197, 0.35));
      }
      #zorai-boot .zorai-boot-ring {
        position: absolute;
        inset: -10px;
        border-radius: 32px;
        animation: zorai-boot-pulse 2.8s ease-out infinite;
      }
      @keyframes zorai-boot-breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.04); }
      }
      @keyframes zorai-boot-pulse {
        0%   { transform: scale(0.92); opacity: 0.8; }
        100% { transform: scale(1.18); opacity: 0; }
      }

      /* Brand wordmark */
      #zorai-boot .zorai-boot-word {
        font-size: 34px;
        letter-spacing: 0.32em;
        text-indent: 0.32em; /* keeps letters optically centered with tracking */
        /* text-transform: uppercase; */
        background: #d9e2ef;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #zorai-boot .zorai-boot-tagline {
        margin-top: 10px;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #8593a7;
      }

      /* Loading bar */
      #zorai-boot .zorai-boot-bar {
        margin-top: 34px;
        width: 220px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden;
      }
      #zorai-boot .zorai-boot-bar-fill {
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #77d8c5, #5882f7);
        animation: zorai-boot-slide 1.4s ease-in-out infinite;
      }
      @keyframes zorai-boot-slide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(300%); }
      }

      #zorai-boot .zorai-boot-status {
        margin-top: 14px;
        min-height: 16px;
        font-size: 12px;
        color: #8593a7;
        transition: opacity 0.2s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        #zorai-boot .zorai-boot-orb,
        #zorai-boot .zorai-boot-logo,
        #zorai-boot .zorai-boot-ring,
        #zorai-boot .zorai-boot-bar-fill { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="zorai-boot" aria-hidden="true">
      <div class="zorai-boot-orb zorai-boot-orb--a"></div>
      <div class="zorai-boot-orb zorai-boot-orb--b"></div>
      <div class="zorai-boot-logo-wrap">
        <img class="zorai-boot-logo" src="./assets/zorai-wb-white.png" alt="Zorai logo" />
        <div class="zorai-boot-ring"></div>
      </div>
      <div class="zorai-boot-word">Zorai</div>
      <div class="zorai-boot-tagline">Daemon-first agentic runtime</div>
      <div class="zorai-boot-bar"><div class="zorai-boot-bar-fill"></div></div>
      <div class="zorai-boot-status" id="zorai-boot-status">Starting Zorai…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
